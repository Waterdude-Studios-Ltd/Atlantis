name: Tests

on:
  push:

concurrency:
  group: tests-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[test]') }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  unit:
    name: JUnit
    if: contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JUnit tests
        run: ./gradlew :common:1.21.1:test :fabric:1.21.1:test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: "**/build/test-results/**/*.xml"

  integration:
    name: JUnit integration (MySQL, Redis)
    if: contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run integration tests
        run: ./gradlew :common:1.21.1:integrationTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: "**/build/test-results/integrationTest/*.xml"

  gametest:
    name: GameTest (${{ matrix.name }})
    if: contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            task: ":fabric:1.21.1:runGameTest"
          - name: NeoForge
            task: ":neoforge:1.21.1:runGameTestServer"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests
        run: ./gradlew ${{ matrix.task }}
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.name }}
          path: "*/versions/1.21.1/build/run/gameTest/logs/"
