name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # Cobblemon, Impactor and FPAPI resolve from local jars unless their versions are set in gradle.properties.
  # Set the LIBRARIES_ARCHIVE_URL secret to a .tar.gz of those jars to provide them here.
  LIBRARIES_DIR: ${{ github.workspace }}/.ci-libraries

jobs:
  unit:
    name: JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch local-only libraries
        env:
          LIBRARIES_ARCHIVE_URL: ${{ secrets.LIBRARIES_ARCHIVE_URL }}
        run: |
          mkdir -p "$LIBRARIES_DIR"
          if [ -n "$LIBRARIES_ARCHIVE_URL" ]; then
            curl -fsSL "$LIBRARIES_ARCHIVE_URL" | tar -xz -C "$LIBRARIES_DIR"
          else
            echo "::warning::LIBRARIES_ARCHIVE_URL is not set; integrations without a Maven version will be missing."
          fi
      - name: Run JUnit tests
        run: ./gradlew :common:1.21.1:test :fabric:1.21.1:test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: "**/build/test-results/**/*.xml"

  integration:
    name: JUnit integration (MySQL, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch local-only libraries
        env:
          LIBRARIES_ARCHIVE_URL: ${{ secrets.LIBRARIES_ARCHIVE_URL }}
        run: |
          mkdir -p "$LIBRARIES_DIR"
          if [ -n "$LIBRARIES_ARCHIVE_URL" ]; then
            curl -fsSL "$LIBRARIES_ARCHIVE_URL" | tar -xz -C "$LIBRARIES_DIR"
          else
            echo "::warning::LIBRARIES_ARCHIVE_URL is not set; integrations without a Maven version will be missing."
          fi
      - name: Run integration tests
        run: ./gradlew :common:1.21.1:integrationTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: "**/build/test-results/integrationTest/*.xml"

  gametest:
    name: GameTest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            task: ":fabric:1.21.1:runGameTest"
          - name: NeoForge
            task: ":neoforge:1.21.1:runGameTestServer"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch local-only libraries
        env:
          LIBRARIES_ARCHIVE_URL: ${{ secrets.LIBRARIES_ARCHIVE_URL }}
        run: |
          mkdir -p "$LIBRARIES_DIR"
          if [ -n "$LIBRARIES_ARCHIVE_URL" ]; then
            curl -fsSL "$LIBRARIES_ARCHIVE_URL" | tar -xz -C "$LIBRARIES_DIR"
          else
            echo "::warning::LIBRARIES_ARCHIVE_URL is not set; integrations without a Maven version will be missing."
          fi
      - name: Run GameTests
        run: ./gradlew ${{ matrix.task }}
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.name }}
          path: "*/versions/1.21.1/build/run/gameTest/logs/"
